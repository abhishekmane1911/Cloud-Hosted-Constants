apiVersion: apps/v1
kind: Deployment
metadata:
  name: constants-api
  namespace: constants-mgmt
spec:
  replicas: 3
  selector:
    matchLabels:
      app: constants-api
  template:
    metadata:
      labels:
        app: constants-api
    spec:
      containers:
      - name: constants-api
        image: constants-mgmt/api:latest
        ports:
        - containerPort: 3001
        env:
        - name: NODE_ENV
          value: production
        - name: PORT
          value: "3001"
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: api-secret
              key: mongodb-uri
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: api-secret
              key: redis-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: api-secret
              key: jwt-secret
        - name: JWT_REFRESH_SECRET
          valueFrom:
            secretKeyRef:
              name: api-secret
              key: jwt-refresh-secret
        - name: CORS_ORIGIN
          value: https://constants.example.com
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "125m"
          limits:
            memory: "512Mi"
            cpu: "250m"

---
apiVersion: v1
kind: Service
metadata:
  name: constants-api
  namespace: constants-mgmt
spec:
  selector:
    app: constants-api
  ports:
  - port: 3001
    targetPort: 3001
  type: ClusterIP

