apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: constants-ingress
  namespace: constants-mgmt
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
spec:
  tls:
  - hosts:
    - constants.example.com
    - api.constants.example.com
    secretName: constants-tls
  rules:
  - host: constants.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: constants-dashboard
            port:
              number: 80
  - host: api.constants.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: constants-api
            port:
              number: 3001

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: constants-network-policy
  namespace: constants-mgmt
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - namespaceSelector:
        matchLabels:
          name: constants-mgmt
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: constants-mgmt
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 443